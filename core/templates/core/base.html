<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}LearnPal{% endblock %}</title>

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          animation: {
            fadeIn: "fadeIn 0.6s ease-in-out",
            slideIn: "slideIn 0.3s ease-out",
            pulse: "pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite",
          },
          keyframes: {
            fadeIn: {
              "0%": { opacity: 0 },
              "100%": { opacity: 1 },
            },
            slideIn: {
              "0%": { transform: "translateY(-10px)", opacity: 0 },
              "100%": { transform: "translateY(0)", opacity: 1 },
            },
          },
        },
      },
    }
  </script>

  <!-- Custom CSS for modern form styling -->
  <style>
    .modern-input:focus, .modern-textarea:focus, .modern-select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      background-color: #374151;
    }

    .modern-input:hover, .modern-textarea:hover, .modern-select:hover {
      border-color: #6b7280;
    }

    .progress-bar {
      background: linear-gradient(90deg, #3b82f6 0%, #06b6d4 100%);
      border-radius: 0.25rem;
      transition: width 0.3s ease;
    }

    .card-hover {
      transition: all 0.2s ease;
    }

    .card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .btn-primary {
      background: linear-gradient(135deg, #3b82f6 0%, #06b6d4 100%);
      border: none;
      color: white;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
    }

    .btn-secondary {
      background: #374151;
      border: 1px solid #4b5563;
      color: #f9fafb;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-secondary:hover {
      background: #4b5563;
      border-color: #6b7280;
    }

    .btn-danger {
      background: #dc2626;
      border: none;
      color: white;
      padding: 0.5rem 1rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-danger:hover {
      background: #b91c1c;
      transform: translateY(-1px);
    }

    .status-badge {
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-not-started { background: #374151; color: #9ca3af; }
    .status-in-progress { background: #1e40af; color: #dbeafe; }
    .status-completed { background: #166534; color: #dcfce7; }

    .priority-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      border-radius: 50%;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .priority-1 { background: #dc2626; color: white; }
    .priority-2 { background: #ea580c; color: white; }
    .priority-3 { background: #ca8a04; color: white; }
    .priority-4 { background: #16a34a; color: white; }
    .priority-5 { background: #0891b2; color: white; }

    .animate-slide-in {
      animation: slideIn 0.3s ease-out;
    }
  </style>
</head>
<body class="h-full bg-slate-950 text-slate-100 animate-fadeIn">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-gradient-to-r from-slate-900 via-slate-950 to-slate-900/90 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="{% url 'dashboard' %}" class="font-bold text-lg tracking-wide bg-gradient-to-r from-indigo-300 to-emerald-300 bg-clip-text text-transparent">LearnPal</a>
      <nav class="flex gap-6 text-sm font-medium">
        <a class="hover:text-indigo-300 transition-colors duration-200" href="{% url 'dashboard' %}">Dashboard</a>
        <a class="hover:text-indigo-300 transition-colors duration-200" href="{% url 'goals_home' %}">Goals</a>
        <a class="hover:text-indigo-300 transition-colors duration-200" href="{% url 'resources' %}">Resources</a>
      </nav>
    </div>
  </header>

  <!-- Main content -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800 text-xs text-slate-400 py-6">
    <div class="max-w-6xl mx-auto px-4 flex items-center justify-between">
      <span>© {{ now|date:"Y" }} LearnPal</span>
      <span class="text-slate-500">Built with <span class="text-rose-400">♥</span> using Django + Tailwind</span>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
